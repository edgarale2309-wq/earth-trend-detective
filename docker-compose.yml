services:
  api:
    build: ./api
    ports: ["8000:8000"]
    env_file:
      - path: ./api/.env
        required: false
    volumes: ["./api/data:/app/data"]
  web:
    build: ./web
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1/
    depends_on: [api]
